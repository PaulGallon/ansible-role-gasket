---
- name: Check the installed Gasket package status and version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - '-f=${db:Status-Status}\n${Version}'
      - gasket-dkms
    expand_argument_vars: false
  register: gasket_dkms_installed
  failed_when: gasket_dkms_installed.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Compare the installed version using Debian version ordering
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ gasket_dkms_installed.stdout_lines[1] }}"
      - ge
      - "{{ gasket_dkms_version }}"
  register: gasket_dkms_comparison
  when:
    - gasket_dkms_installed.rc == 0
    - gasket_dkms_installed.stdout_lines | length == 2
    - gasket_dkms_installed.stdout_lines[0] == 'installed'
  failed_when: gasket_dkms_comparison.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Determine whether Gasket needs installation
  ansible.builtin.set_fact:
    gasket_dkms_version_acceptable: "{{ gasket_dkms_comparison.rc | default(1) == 0 }}"

- name: Report the planned Gasket installation in check mode
  ansible.builtin.debug:
    msg: "Gasket DKMS {{ gasket_dkms_version }} or newer needs to be installed."
  when:
    - ansible_check_mode
    - not gasket_dkms_version_acceptable
  changed_when: true

- name: Build and install Gasket when required
  when:
    - not gasket_dkms_version_acceptable
    - not ansible_check_mode
  block:
    - name: Gather the running kernel version
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - kernel

    - name: Install Gasket build dependencies and running kernel headers
      ansible.builtin.apt:
        name:
          - build-essential
          - git
          - debhelper
          - dkms
          - devscripts
          - dh-dkms
          - "linux-headers-{{ ansible_facts.kernel }}"
        state: present
        update_cache: true
      become: true

    - name: Create an isolated Gasket build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: gasket-driver-
      register: gasket_build_directory
      become: false

    - name: Build Gasket in the temporary directory
      become: false
      block:
        - name: Clone the pinned Gasket driver source
          ansible.builtin.git:
            repo: "{{ gasket_driver_repository }}"
            version: "{{ gasket_driver_revision }}"
            dest: "{{ gasket_build_directory.path }}/source"

        - name: Read the source package version
          ansible.builtin.command:
            argv:
              - dpkg-parsechangelog
              - --show-field
              - Version
            chdir: "{{ gasket_build_directory.path }}/source"
          register: gasket_source_version
          changed_when: false

        - name: Check the source meets the requested minimum version
          ansible.builtin.command:
            argv:
              - dpkg
              - --compare-versions
              - "{{ gasket_source_version.stdout }}"
              - ge
              - "{{ gasket_dkms_version }}"
          changed_when: false

        - name: Build the Gasket Debian package
          ansible.builtin.command:
            argv:
              - debuild
              - -us
              - -uc
              - -tc
              - -b
            chdir: "{{ gasket_build_directory.path }}/source"
          register: gasket_build_result
          changed_when: gasket_build_result.rc == 0

        - name: Find the package from this build
          ansible.builtin.find:
            paths: "{{ gasket_build_directory.path }}"
            patterns: 'gasket-dkms_*_all.deb'
            file_type: file
          register: gasket_built_packages

        - name: Require exactly one built Gasket package
          ansible.builtin.assert:
            that:
              - gasket_built_packages.matched == 1
            fail_msg: Expected exactly one Gasket Debian package in the isolated build directory.

        - name: Install the built Gasket package
          ansible.builtin.apt:
            deb: "{{ gasket_built_packages.files[0].path }}"
          become: true

      always:
        - name: Remove the temporary Gasket build directory
          ansible.builtin.file:
            path: "{{ gasket_build_directory.path }}"
            state: absent
